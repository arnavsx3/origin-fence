<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OriginFence | Local Runtime Guard</title>
    <style>
      :root { color-scheme: dark; --ink:#f4f6fb; --muted:#97a1b9; --canvas:#0a1020; --panel:#121b31; --line:#26324e; --green:#39d98a; --red:#ff6978; --amber:#ffcc66; --blue:#7da8ff; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; background:radial-gradient(circle at 80% -10%, #253b70 0, transparent 36%), var(--canvas); color:var(--ink); font:15px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
      main { max-width:1080px; margin:0 auto; padding:48px 24px 72px; }
      .eyebrow { color:var(--blue); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
      h1 { margin:8px 0; font-size:clamp(38px, 6vw, 64px); line-height:.96; letter-spacing:-.055em; }
      .subtitle { max-width:650px; color:var(--muted); font-size:18px; }
      .status { display:inline-flex; gap:9px; align-items:center; margin-top:22px; padding:8px 12px; background:#162544; border:1px solid #2c477c; border-radius:999px; color:#c4d5ff; font-weight:700; }
      .dot { width:8px; height:8px; background:var(--green); border-radius:50%; box-shadow:0 0 12px var(--green); }
      .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:40px 0 22px; }
      .metric, .timeline { background:color-mix(in srgb, var(--panel) 90%, transparent); border:1px solid var(--line); border-radius:18px; }
      .metric { padding:20px; } .metric span { display:block; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } .metric strong { display:block; margin-top:9px; font-size:34px; letter-spacing:-.04em; }
      .timeline { overflow:hidden; } .timeline-header { display:flex; justify-content:space-between; align-items:center; padding:20px 22px; border-bottom:1px solid var(--line); } h2 { margin:0; font-size:18px; } button { cursor:pointer; border:1px solid #37579c; background:#1c3260; color:#dce7ff; border-radius:9px; padding:8px 12px; font-weight:700; }
      .event { display:grid; grid-template-columns:100px minmax(110px, 1fr) 92px; gap:18px; padding:16px 22px; border-bottom:1px solid var(--line); } .event:last-child { border:0; } .event small { color:var(--muted); } .target { font-weight:700; overflow-wrap:anywhere; } .reason { grid-column:2 / 4; color:var(--muted); font-size:13px; } .verdict { align-self:start; justify-self:end; padding:4px 8px; border-radius:999px; font-size:11px; font-weight:900; letter-spacing:.06em; } .allow { background:#153a30; color:var(--green); } .block { background:#49202b; color:var(--red); } .ask { background:#4d3d1c; color:var(--amber); }
      .empty { padding:48px 22px; text-align:center; color:var(--muted); } @media (max-width:650px) { .grid { grid-template-columns:1fr; } .event { grid-template-columns:80px 1fr; gap:8px; } .verdict { grid-column:2; justify-self:start; } .reason { grid-column:2; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Local runtime guard</div>
      <h1>OriginFence</h1>
      <p class="subtitle">Trace what an AI agent causes. Enforce policy before a risky process chain escapes the machine.</p>
      <div class="status"><span class="dot"></span> Monitoring local sessions</div>
      <section class="grid">
        <div class="metric"><span>Observed events</span><strong id="events">0</strong></div>
        <div class="metric"><span>Blocked actions</span><strong id="blocked">0</strong></div>
        <div class="metric"><span>Storage</span><strong>Local</strong></div>
      </section>
      <section class="timeline">
        <div class="timeline-header"><h2>Runtime timeline</h2><button id="refresh">Refresh</button></div>
        <div id="timeline" class="empty">Run <code>originfence demo blocked</code> to generate a protected event chain.</div>
      </section>
    </main>
    <script>
      const timeline = document.querySelector('#timeline');
      async function refresh() {
        const events = await fetch('/api/timeline').then(response => response.json());
        document.querySelector('#events').textContent = events.length;
        document.querySelector('#blocked').textContent = events.filter(event => event.verdict === 'block').length;
        if (!events.length) return;
        timeline.className = '';
        timeline.innerHTML = events.map(event => `<article class="event"><small>${event.kind.replace('_', ' ')}</small><div class="target">${event.target || '—'}</div><span class="verdict ${event.verdict}">${event.verdict}</span><div class="reason">${event.reason}</div></article>`).join('');
      }
      document.querySelector('#refresh').addEventListener('click', refresh);
      refresh();
    </script>
  </body>
</html>
