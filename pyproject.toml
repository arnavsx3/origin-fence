[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "originfence"
version = "0.1.0"
description = "Local runtime guardrails for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psutil>=6.0,<7.0",
  "pydantic>=2.0,<3.0",
  "pyyaml>=6.0,<7.0",
  "streamlit>=1.39,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
originfence = "originfence.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
